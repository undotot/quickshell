name: Release QuickShell

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure public package registry
        run: npm config set registry https://registry.npmjs.org

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -ne $tagVersion) {
            throw "Git tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is missing"
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY.Length -lt 300) {
            throw "TAURI_SIGNING_PRIVATE_KEY appears incomplete; paste the full private key file content"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"
          }

      - name: Build and sign Tauri updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Generate updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run release:manifest

      - name: Verify updater artifacts
        shell: pwsh
        run: |
          $bundlePath = Join-Path $PWD "src-tauri/target/release/bundle/nsis"
          $zip = Get-ChildItem -LiteralPath $bundlePath -Filter "*.nsis.zip" -File
          $sig = Get-ChildItem -LiteralPath $bundlePath -Filter "*.nsis.zip.sig" -File
          if (-not $zip) { throw "NSIS updater bundle (.nsis.zip) was not generated" }
          if (-not $sig) { throw "NSIS updater signature (.nsis.zip.sig) was not generated" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            release-assets/latest.json
