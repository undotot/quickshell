name: Release QuickShell

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Configure public package registry
        run: yarn config set registry https://registry.npmjs.org

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -ne $tagVersion) {
            throw "Git tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Install dependencies
        run: yarn install --frozen-lockfile --network-timeout 120000

      - name: Build and sign Tauri updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: yarn tauri build

      - name: Generate updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: yarn release:manifest

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/nsis/*.nsis.zip.sig
            release-assets/latest.json
