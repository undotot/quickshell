name: Release QuickShell

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure public package registry
        run: npm config set registry https://registry.npmjs.org

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -ne $tagVersion) {
            throw "Git tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Tauri NSIS installer
        run: npm run tauri build

      - name: Collect installer artifact
        shell: pwsh
        run: |
          $targetDirectory = Join-Path $PWD "src-tauri/target"
          if (-not (Test-Path -LiteralPath $targetDirectory -PathType Container)) {
            throw "Tauri target directory was not generated: $targetDirectory"
          }

          $bundleDirectory = Get-ChildItem -LiteralPath $targetDirectory -Directory -Recurse |
            Where-Object { $_.FullName -match '[\\/]release[\\/]bundle[\\/]nsis$' } |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $bundleDirectory) {
            Write-Output "Generated target directories:"
            Get-ChildItem -LiteralPath $targetDirectory -Directory -Recurse | Select-Object -ExpandProperty FullName
            throw "Tauri NSIS directory not found: $targetDirectory"
          }

          $installer = Get-ChildItem -LiteralPath $bundleDirectory.FullName -Filter "*.exe" -File
          if (-not $installer) { throw "NSIS installer was not generated: $($bundleDirectory.FullName)" }

          $releaseBundleDirectory = Join-Path $PWD "release-bundle"
          New-Item -ItemType Directory -Force -Path $releaseBundleDirectory | Out-Null
          foreach ($file in $installer) {
            Copy-Item -LiteralPath $file.FullName -Destination $releaseBundleDirectory -Force
          }

          Write-Output "Using Tauri NSIS directory: $($bundleDirectory.FullName)"
          Write-Output "Installer artifact: $($installer.Name -join ', ')"

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $bundlePath = Join-Path $PWD "release-bundle"
          $installer = Get-ChildItem -LiteralPath $bundlePath -Filter "*.exe" -File
          if (-not $installer) { throw "NSIS installer (.exe) was not collected" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-bundle/*.exe
