name: Release QuickShell

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure public package registry
        run: npm config set registry https://registry.npmjs.org

      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          if ($version -ne $tagVersion) {
            throw "Git tag $env:GITHUB_REF_NAME does not match package version $version"
          }

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Validate updater signing secrets
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw "TAURI_SIGNING_PRIVATE_KEY is missing"
          }
          if ($env:TAURI_SIGNING_PRIVATE_KEY.Length -lt 300) {
            throw "TAURI_SIGNING_PRIVATE_KEY appears incomplete"
          }
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD)) {
            throw "TAURI_SIGNING_PRIVATE_KEY_PASSWORD is missing"
          }

      - name: Build and sign Tauri updater artifacts
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Collect updater artifacts
        shell: pwsh
        run: |
          $targetDirectory = Join-Path $PWD "src-tauri/target"
          if (-not (Test-Path -LiteralPath $targetDirectory -PathType Container)) {
            throw "Tauri target directory was not generated: $targetDirectory"
          }

          $bundleDirectory = Get-ChildItem -LiteralPath $targetDirectory -Directory -Recurse |
            Where-Object { $_.FullName -match '[\\/]release[\\/]bundle[\\/]nsis$' } |
            Sort-Object FullName |
            Select-Object -First 1

          if (-not $bundleDirectory) {
            Write-Output "Generated target directories:"
            Get-ChildItem -LiteralPath $targetDirectory -Directory -Recurse | Select-Object -ExpandProperty FullName
            throw "Tauri NSIS directory not found: $targetDirectory"
          }

          $zip = Get-ChildItem -LiteralPath $bundleDirectory.FullName -Filter "*.nsis.zip" -File
          $signature = Get-ChildItem -LiteralPath $bundleDirectory.FullName -Filter "*.nsis.zip.sig" -File
          $installer = Get-ChildItem -LiteralPath $bundleDirectory.FullName -Filter "*.exe" -File
          if (-not $zip) { throw "NSIS updater bundle was not generated: $($bundleDirectory.FullName)" }
          if (-not $signature) { throw "NSIS updater signature was not generated: $($bundleDirectory.FullName)" }
          if (-not $installer) { throw "NSIS installer was not generated: $($bundleDirectory.FullName)" }

          $releaseBundleDirectory = Join-Path $PWD "release-bundle"
          New-Item -ItemType Directory -Force -Path $releaseBundleDirectory | Out-Null
          foreach ($file in @($installer) + @($zip) + @($signature)) {
            Copy-Item -LiteralPath $file.FullName -Destination $releaseBundleDirectory -Force
          }

          "UPDATER_BUNDLE_DIRECTORY=release-bundle" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Output "Using Tauri NSIS directory: $($bundleDirectory.FullName)"

      - name: Generate updater manifest
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: npm run release:manifest

      - name: Verify updater artifacts
        shell: pwsh
        run: |
          $bundlePath = Join-Path $PWD "release-bundle"
          $installer = Get-ChildItem -LiteralPath $bundlePath -Filter "*.exe" -File
          $zip = Get-ChildItem -LiteralPath $bundlePath -Filter "*.nsis.zip" -File
          $sig = Get-ChildItem -LiteralPath $bundlePath -Filter "*.nsis.zip.sig" -File
          $manifest = Join-Path $PWD "release-assets/latest.json"
          if (-not $installer) { throw "NSIS installer (.exe) was not collected" }
          if (-not $zip) { throw "NSIS updater bundle (.nsis.zip) was not collected" }
          if (-not $sig) { throw "NSIS updater signature (.nsis.zip.sig) was not collected" }
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) { throw "Updater manifest was not generated: $manifest" }

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            release-bundle/*.exe
            release-bundle/*.nsis.zip
            release-bundle/*.nsis.zip.sig
            release-assets/latest.json
